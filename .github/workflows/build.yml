name: Build APK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'uploads/**'      # only trigger when a ZIP is pushed; old ZIPs never retrigger builds
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Find and unzip uploaded project
        run: |
          ZIP=$(find . -path './.git' -prune -o -maxdepth 3 -name "*.zip" -printf "%T@ %p\n" | sort -rn | head -1 | cut -d" " -f2-)
          if [ -z "$ZIP" ]; then
            echo "##[error]No ZIP file found in repository!"
            exit 1
          fi
          ZIP_NAME=$(basename "$ZIP" .zip)
          echo "zip_name=$ZIP_NAME" >> $GITHUB_ENV
          echo "zip_path=$ZIP" >> $GITHUB_ENV
          echo "Found zip: $ZIP"
          unzip -q "$ZIP" -d extracted

      # This repo is a .NET MAUI app, not a Gradle project, so there is no
      # settings.gradle to look for. Find the Android-targeting .csproj instead.
      - name: Find MAUI Android project
        id: find_project
        run: |
          PROJECT=$(grep -rl "android" --include="*.csproj" extracted | xargs grep -l "UseMaui" | head -1)
          if [ -z "$PROJECT" ]; then
            echo "##[error]No MAUI Android (.csproj) project found inside the zip!"
            find extracted -maxdepth 5 -name "*.csproj"
            exit 1
          fi
          TFM=$(grep -oP '(?<=<TargetFrameworks>)[^<]*android[^<]*' "$PROJECT" | head -1)
          echo "Found project: $PROJECT (target: $TFM)"
          echo "project_path=$PROJECT" >> $GITHUB_OUTPUT
          echo "project_dir=$(dirname "$PROJECT")" >> $GITHUB_OUTPUT
          echo "tfm=$TFM" >> $GITHUB_OUTPUT

      # dotnet resolves global.json by walking UP from the working directory,
      # so the repo-root copy (pinned to SDK 6.0.0) breaks every dotnet command
      # in this job even though the actual project lives under extracted/.
      - name: Remove incompatible global.json SDK pins
        run: |
          rm -f global.json
          find extracted -maxdepth 3 -name "global.json" -delete

      # The repo has no Resources/Images or Resources/Fonts folder, but the
      # csproj references appicon.png / splash.png / Consolas.ttf, so the
      # build fails without placeholders.
      - name: Create placeholder MAUI assets if missing
        working-directory: ${{ steps.find_project.outputs.project_dir }}
        run: |
          mkdir -p Resources/Images Resources/Fonts
          python3 -c "
          import base64, os
          png = base64.b64decode('iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==')
          for f in ['Resources/Images/appicon.png', 'Resources/Images/splash.png']:
              if not os.path.exists(f):
                  open(f, 'wb').write(png)
          ttf_stub = base64.b64decode('AABAAAAQAAIABAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==')
          f = 'Resources/Fonts/Consolas.ttf'
          if not os.path.exists(f):
              open(f, 'wb').write(ttf_stub)
          "

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Install MAUI Android workload
        run: |
          dotnet workload install maui-android --skip-sign-check
          dotnet workload restore ${{ steps.find_project.outputs.project_path }}

      - name: Decode keystore (if available)
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > $RUNNER_TEMP/release.jks
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
            echo "HAS_KEYSTORE=true" >> $GITHUB_ENV
          else
            echo "HAS_KEYSTORE=false" >> $GITHUB_ENV
            echo "No KEYSTORE_BASE64 secret — building a sideload-ready debug APK"
          fi

      - name: Build APK
        id: build
        run: |
          PROJECT="${{ steps.find_project.outputs.project_path }}"
          TFM="${{ steps.find_project.outputs.tfm }}"
          if [ "${{ env.HAS_KEYSTORE }}" = "true" ]; then
            dotnet publish "$PROJECT" -f "$TFM" -c Release \
              -p:AndroidSdkDirectory=$ANDROID_SDK_ROOT \
              -p:AndroidKeyStore=true \
              -p:AndroidSigningKeyStore="${{ env.KEYSTORE_PATH }}" \
              -p:AndroidSigningKeyAlias="${{ secrets.KEY_ALIAS }}" \
              -p:AndroidSigningKeyPass="${{ secrets.KEY_PASSWORD }}" \
              -p:AndroidSigningStorePass="${{ secrets.STORE_PASSWORD }}"
          else
            # EmbedAssembliesIntoApk + disabling Fast Deployment is the fix for the
            # "No assemblies found ... Assuming this is part of Fast Deployment" crash:
            # a plain dotnet build Debug APK expects an IDE to push assemblies to the
            # device separately, so sideloading the raw APK has nothing to load.
            # RuntimeIdentifiers=android-arm64 builds for one ABI instead of all
            # four (arm64/armeabi-v7a/x86/x86_64), which is most of the size cut.
            dotnet build "$PROJECT" -f "$TFM" -c Debug \
              -p:AndroidSdkDirectory=$ANDROID_SDK_ROOT \
              -p:EmbedAssembliesIntoApk=true \
              -p:AndroidUseFastDeployment=false \
              -p:RuntimeIdentifiers=android-arm64
          fi

      - name: Locate APK
        id: apk
        run: |
          if [ "${{ env.HAS_KEYSTORE }}" = "true" ]; then
            APK=$(find ${{ steps.find_project.outputs.project_dir }} -path "*/bin/Release/*" -name "*-Signed.apk" | head -1)
          else
            APK=$(find ${{ steps.find_project.outputs.project_dir }} -path "*/bin/Debug/*" -name "*.apk" | head -1)
          fi
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.zip_name }}-${{ env.HAS_KEYSTORE == 'true' && 'release' || 'debug' }}-v${{ github.run_number }}
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      # Delete zip after successful build so leftover ZIPs never retrigger this workflow.
      - name: Clean up - delete zip after successful build
        if: success()
        run: |
          ZIP="${{ env.zip_path }}"
          if [ -n "$ZIP" ] && [ -f "$ZIP" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm "$ZIP"
            git commit -m "ci: remove $ZIP after build #${{ github.run_number }} [skip ci]"
            git push
          fi

      - name: Clean up - delete zip after failed build
        if: failure()
        run: |
          ZIP="${{ env.zip_path }}"
          if [ -n "$ZIP" ] && [ -f "$ZIP" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git rm "$ZIP"
            git commit -m "ci: remove $ZIP (build failed #${{ github.run_number }}) [skip ci]"
            git push
          fi
